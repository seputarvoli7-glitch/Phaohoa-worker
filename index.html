<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
}

video {
    width: 100%;
    height: 100%;
    background: #000;
    display: block;
}
</style>
</head>

<body>

<video id="video" controls autoplay playsinline></video>

<script>

const video = document.getElementById("video");

/*
========================================
PILIH STREAM
========================================

HLS  = Rumble
DASH = Gvision
*/

const TYPE = "DASH";


/*
========================================
RUMBLE HLS
========================================
*/

const HLS_URL =
"https://phaohoa-worker.seputarvoli7.workers.dev/?url=https%3A%2F%2Fhugh.cdn.rumble.cloud%2Flive%2F3fms19g4%2Flive-hls%2Fsqg5-axz7%2Fchunklist_i0_DVR.m3u8";


/*
========================================
GVISION DASH
========================================
*/

const DASH_URL =
"https://gvision-dash.seputarvoli7.workers.dev/";


/*
========================================
HLS
========================================
*/

function startHLS() {

    if (!Hls.isSupported()) {

        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src = HLS_URL;
            video.play().catch(() => {});

        }

        return;
    }

    const hls = new Hls({
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 5,
        startPosition: -1
    });

    hls.loadSource(HLS_URL);

    hls.attachMedia(video);

    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

            video.play().catch(() => {});

        }
    );

    hls.on(
        Hls.Events.ERROR,
        function (event, data) {

            console.log("HLS ERROR:", data);

            if (data.fatal) {

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    hls.startLoad();

                }

                else if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    hls.recoverMediaError();

                }

            }

        }
    );
}


/*
========================================
DASH
========================================
*/

function startDASH() {

    const player =
        dashjs.MediaPlayer().create();

    player.initialize(
        video,
        DASH_URL,
        true
    );

    player.updateSettings({
        streaming: {
            liveCatchup: {
                enabled: true
            }
        }
    });

    player.on(
        dashjs.MediaPlayer.events.STREAM_INITIALIZED,
        function () {

            video.play().catch(() => {});

        }
    );

    player.on(
        dashjs.MediaPlayer.events.ERROR,
        function (error) {

            console.log(
                "DASH ERROR:",
                error
            );

        }
    );
}


/*
========================================
JALANKAN
========================================
*/

if (TYPE === "HLS") {

    startHLS();

}

else if (TYPE === "DASH") {

    startDASH();

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LIVE STREAM</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    #status {
      color: white;
      background: #111;
      padding: 10px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <video
    id="video"
    controls
    autoplay
    muted
    playsinline>
  </video>

  <div id="status">
    Menghubungkan ke LIVE...
  </div>

  <script>

    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    const STREAM =
      "https://phaohoa-worker.seputarvoli7.workers.dev/live/phaohoa5/index.m3u8";


    if (Hls.isSupported()) {

      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,

        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 6,

        maxBufferLength: 10,
        backBufferLength: 5
      });

      hls.loadSource(STREAM);

      hls.attachMedia(video);


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          status.textContent =
            "🔴 LIVE TERHUBUNG";

          video.play().catch(function () {

            status.textContent =
              "LIVE siap. Tekan PLAY.";

          });

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.log(
            "HLS ERROR:",
            data
          );

          if (data.fatal) {

            status.textContent =
              "Gagal memuat LIVE.";

          }

        }
      );

    }

    else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src = STREAM;

    }

    else {

      status.textContent =
        "Browser tidak mendukung HLS.";

    }

  </script>

</body>
</html>
